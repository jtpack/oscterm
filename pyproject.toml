[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "oscterm"
description = "A command line terminal for OSC communication"
version = "0.0.1"
requires-python = ">= 3.9"
dependencies = [
    "python-osc",
    "prompt-toolkit"
]
authors = [
    {name = "Scott Lumsden", email = "jtpack@gmail.com"}
]
readme = "README.md"

[project.scripts]
oscterm = "oscterm.cli:main"
